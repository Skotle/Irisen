spring.application.name=Spring_04

# Runtime input in Spring04Application sets:
# server.port
# spring.datasource.url
# spring.datasource.username
# spring.datasource.password
# spring.mail.username
# spring.mail.password
#
# Local SQLite runtime:
# APP_DB_MODE=sqlite
# APP_SQLITE_DB_PATH=mydb.db

# SQLite is not used.
# spring.datasource.url=jdbc:sqlite:mydb.db
# spring.datasource.driver-class-name=org.sqlite.JDBC
server.address=localhost
#0.0.0.0
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.encoding.force-request=true
server.servlet.encoding.force-response=true

spring.devtools.restart.enabled=false

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.checkserveridentity=false
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1

server.tomcat.max-swallow-size=-1
server.tomcat.max-http-form-post-size=-1
server.tomcat.threads.max=32
server.tomcat.threads.min-spare=4
server.tomcat.accept-count=50

app.gcs.bucket-name=irisen-alpha
app.gcs.public-base-url=https://storage.googleapis.com
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.forward-headers-strategy=framework

app.security.trusted-proxies=127.0.0.1,::1
app.security.admin-login-code=admin_irisen_202605061204
app.security.admin-allowed-addresses=122.38.33.23
app.security.blocked-addresses=103.215.75.221
app.security.page-rate-limit.enabled=true
app.security.page-rate-limit.requests-per-minute=60
app.security.ip-location.enabled=true
app.security.ip-location.endpoint=https://ipwho.is/{ip}?fields=success,country,region,city,ip
app.security.ip-location.timeout-ms=1200
app.security.ip-location.cache-hours=6

logging.level.org.apache.coyote.http11.Http11Processor=ERROR
logging.level.org.apache.tomcat.util.net.NioEndpoint=ERROR
logging.file.name=logs/server.log
logging.level.root=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
